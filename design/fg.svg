<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD27A"/><stop offset="1" stop-color="#FF8A00"/>
    </linearGradient>
    <linearGradient id="coin2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A3A46"/><stop offset="1" stop-color="#1B1B22"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- back coin (yen) -->
  <g filter="url(#sh)">
    <circle cx="64" cy="62" r="17" fill="url(#coin2)" stroke="#FFB340" stroke-width="1.6"/>
    <text x="64" y="68.6" text-anchor="middle" font-family="Inter" font-weight="800" font-size="19" fill="#FFC163">¥</text>
  </g>
  <!-- front coin (dollar) -->
  <g filter="url(#sh)">
    <circle cx="45" cy="46" r="17" fill="url(#coin)"/>
    <circle cx="45" cy="46" r="13.6" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1"/>
    <text x="45" y="52.8" text-anchor="middle" font-family="Inter" font-weight="800" font-size="19" fill="#1A1206">$</text>
  </g>
  <!-- exchange arrows -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <path d="M66 32 a20 20 0 0 1 12 16"/>
    <path d="M74.5 45.5 L78 48.5 L81 44.6"/>
    <path d="M43 76 a20 20 0 0 1 -12 -16"/>
    <path d="M34.5 62.5 L31 59.5 L28 63.4"/>
  </g>
</svg>
