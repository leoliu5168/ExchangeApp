name: Build FX Calculator APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk FxCalc.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FxCalc-apk
          path: FxCalc.apk

      - name: Publish to "fxcalc-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fxcalc-latest
          name: 匯率轉換 (最新版)
          prerelease: true
          body: |
            自動建置：${{ github.sha }}
            在手機上下載 FxCalc.apk 並安裝（需允許「安裝未知來源應用程式」）。
          files: FxCalc.apk
